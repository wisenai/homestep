<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- floor -->
  <line x1="40" y1="230" x2="400" y2="230" stroke="#444" stroke-width="2"/>
  <!-- stick and phone -->
  <line x1="70" y1="230" x2="95" y2="70" stroke="#222" stroke-width="5"/>
  <rect x="84" y="80" width="18" height="34" rx="3" fill="#1f2a44"/>
  <text x="112" y="76" fill="#222">phone, about 0.9 m up,</text>
  <text x="112" y="92" fill="#222">looking about 45° down</text>
  <!-- view rays -->
  <line x1="98" y1="100" x2="190" y2="230" stroke="#999" stroke-dasharray="4 4"/>
  <line x1="98" y1="100" x2="560" y2="230" stroke="#999" stroke-dasharray="4 4"/>
  <!-- scale: 1 m = 400 px, origin at x=90 -->
  <!-- reference strip 0.25-0.40 m -->
  <rect x="190" y="222" width="60" height="16" fill="#3b82f6" opacity="0.8"/>
  <text x="168" y="262" fill="#1d4ed8">reference strip</text>
  <text x="172" y="278" fill="#1d4ed8">0.25–0.40 m</text>
  <!-- probe strip 0.40-0.70 m (warn 0.45 + 0.25) -->
  <rect x="250" y="222" width="120" height="16" fill="#22c55e" opacity="0.8"/>
  <text x="262" y="262" fill="#15803d">probe strip 0.40 m</text>
  <text x="262" y="278" fill="#15803d">to warn + 0.25 m</text>
  <!-- obstacle range to 0.90 m -->
  <line x1="90" y1="160" x2="450" y2="160" stroke="#f97316" stroke-width="2"/>
  <line x1="450" y1="150" x2="450" y2="170" stroke="#f97316" stroke-width="2"/>
  <text x="300" y="150" fill="#c2410c">obstacles: 0.25 m tall, within 0.90 m</text>
  <!-- warn distance marker at 0.45 m -->
  <line x1="270" y1="190" x2="270" y2="240" stroke="#dc2626" stroke-dasharray="3 3"/>
  <text x="276" y="200" fill="#b91c1c">speaks here (warn 0.45 m)</text>
  <!-- step down drawn at 0.62 m -->
  <polyline points="400,230 400,262 740,262" fill="none" stroke="#444" stroke-width="2"/>
  <text x="560" y="254" fill="#444">a step down</text>
</svg>
