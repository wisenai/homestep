name: HomeStep

options:
  bundleIdPrefix: com.sathvik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Your signing team lives here, per machine (see Config/Signing.example.xcconfig).
packages:
  HomeStepCore:
    path: Core

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

targets:
  HomeStep:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: HomeStepCore
    info:
      path: HomeStep/Info.plist
      properties:
        CFBundleDisplayName: HomeStep
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "HomeStep uses the camera to read the markers you place and to sense steps and obstacles ahead. Images never leave your iPhone."
        # NB: do NOT hard-require `arkit`. The app must LAUNCH and message
        # gracefully when LiDAR depth is unavailable (R-2.3); markers still work
        # on any ARKit iPhone. A hard requirement also blocks the Simulator.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.navigation
        # Places are shared as .homestep files (Files, AirDrop, Messages).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sathvik.homestep.place
            UTTypeDescription: HomeStep Place
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [homestep]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HomeStep Place
            LSHandlerRank: Owner
            LSItemContentTypes: [com.sathvik.homestep.place]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_NAME: HomeStep
        PRODUCT_BUNDLE_IDENTIFIER: com.sathvik.homestep
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HomeStepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: HomeStep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sathvik.homestep.tests

  HomeStepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: HomeStep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sathvik.homestep.uitests
        TEST_TARGET_NAME: HomeStep

schemes:
  HomeStep:
    build:
      targets:
        HomeStep: all
        HomeStepTests: [test]
        HomeStepUITests: [test]
    test:
      targets: [HomeStepTests, HomeStepUITests]
      environmentVariables:
        SCREENSHOT_DIR: $(SRCROOT)/build/screenshots
        ARTIFACT_DIR: $(SRCROOT)/build
